name: Bug report
description: Report a reproducible problem
title: "bug: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps, OS and app version
      description: Do not attach raw Arena logs, tokens or personal data.
    validations:
      required: true

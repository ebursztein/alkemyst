[workspace]
members = ["src/core", "src/landlord", "src/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0-preview.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Elie Bursztein"]
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

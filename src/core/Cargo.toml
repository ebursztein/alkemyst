[package]
name = "alkemyst-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
utoipa = "=5.5.0"

[dev-dependencies]
manasight-parser = { version = "=0.7.3", default-features = false, features = ["brace_depth_flush"] }
tempfile = "=3.27.0"

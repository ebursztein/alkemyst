[package]
name = "alkemyst-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
landlord = { path = "../landlord" }
tempfile = "=3.27.0"
flate2 = "=1.1.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking", "json"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
utoipa = "=5.5.0"
uuid = { version = "=1.28.0", features = ["v4"] }
axum = "=0.8.9"
subtle = "=2.6.1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio-util = "=0.7.19"
jsonschema = { version = "=0.59.0", default-features = false }

same-file = "=1.0.6"
manasight-parser = { version = "=0.7.3", default-features = false, features = ["brace_depth_flush", "tailer"] }
[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
